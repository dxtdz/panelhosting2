version: '3.8'

services:
  # Node.js Web Panel
  web-panel:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: web-panel-node
    ports:
      - "3000:3000"
      - "3001:3001"  # Socket.IO port
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/webpanel
      - REDIS_URL=redis://redis:6379
      - PYTHON_API_URL=http://python-api:5000
    volumes:
      - ./src:/app/src
      - ./data/uploads:/app/uploads
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mongodb
      - redis
      - python-api
    networks:
      - webpanel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python API Services
  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: web-panel-python
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - MONGODB_URI=mongodb://mongodb:27017/webpanel
    volumes:
      - ./python_services:/app
      - ./data/python_logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - webpanel-network
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:5000 app:app

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: web-panel-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=webpanel
    volumes:
      - ./data/mongodb:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - webpanel-network
    restart: unless-stopped
    command: mongod --auth

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: web-panel-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - webpanel-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: web-panel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web-panel
      - python-api
    networks:
      - webpanel-network
    restart: unless-stopped

  # Monitoring (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: web-panel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - webpanel-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: web-panel-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - webpanel-network
    restart: unless-stopped

networks:
  webpanel-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  grafana_data:
